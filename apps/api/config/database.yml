default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "advisoros") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "advisoros_dev") %>
  database_tasks: true

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "advisoros_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_TEST_NAME", "advisoros_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "advisoros_production") %>
